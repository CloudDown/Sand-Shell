name: syntax
on:
  push:
    branches: [main]
  pull_request:
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: py_compile
        run: python -m py_compile Sand-Shell/Sand-Shell.py Sand-Shell/shell.py Sand-Shell/settings.py Sand-Shell/game.py Sand-Shell/install-app.py
